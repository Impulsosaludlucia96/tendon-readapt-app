<script src="js/matrix-algorithm.js"></script>
<script>
    function nextStep(stepNumber) {
        document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
        document.getElementById('step' + stepNumber).classList.add('active');
    }

    async function submitAssessment() {
        const irsTotal = 
            parseInt(document.getElementById('irs_sleep').value) +
            parseInt(document.getElementById('irs_fatigue').value) +
            parseInt(document.getElementById('irs_stress').value) +
            parseInt(document.getElementById('irs_mood').value);

        const formData = {
            eva: parseInt(document.getElementById('eva').value),
            stiffness24h: document.getElementById('stiffness24h').value,
            canWalkWithoutPain: document.getElementById('canWalk').value === 'true',
            consecutiveHighLoadDays: parseInt(document.getElementById('consecutiveHighLoadDays').value),
            irsTotal: irsTotal
        };

        // Verificación de seguridad por si no carga la función del algoritmo
        let result;
        if (typeof processAssessment === 'function') {
            result = processAssessment(formData);
        } else {
            // Lógica de respaldo si el script JS externo falla
            let state = (formData.eva > 3 || !formData.canWalkWithoutPain) ? 'ROJO' : 
                        (formData.stiffness24h === 'peor' || formData.eva === 3 || formData.irsTotal < 14) ? 'NARANJA' : 'VERDE';
            result = { dailyState: state, reasons: ['Cálculo directo aplicado.'] };
        }

        document.getElementById('tendonForm').style.display = 'none';
        const resultDiv = document.getElementById('result');
        resultDiv.className = result.dailyState;
        resultDiv.style.display = 'block';

        document.getElementById('statusTitle').innerText = 'Estado Diario: ' + result.dailyState;
        document.getElementById('statusReasons').innerHTML = '<strong>Puntuación IRS:</strong> ' + irsTotal + '/28<br>' + 
            (result.reasons.length > 0 ? '<strong>Motivos:</strong> ' + result.reasons.join(' ') : 'Parámetros óptimos.');

        // PETICIÓN FETCH DE EJERCICIOS CON MANEJO DE ERRORES VISUAL
        const exerciseContainer = document.getElementById('exerciseList');
        try {
            const response = await fetch('data/achilles-exercises.json');
            if (!response.ok) throw new Error('No se pudo encontrar data/achilles-exercises.json');
            
            const data = await response.json();
            exerciseContainer.innerHTML = '';

            data.exercises.forEach(ex => {
                let show = false;
                if (result.dailyState === 'VERDE') show = true;
                if (result.dailyState === 'NARANJA' && (ex.loadCategory === 'AZUL' || ex.loadCategory === 'NARANJA')) show = true;
                if (result.dailyState === 'ROJO' && ex.loadCategory === 'AZUL') show = true;

                if (show) {
                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    card.innerHTML = `
                        <strong>${ex.name}</strong><br>
                        <small>Categoría: <strong>${ex.loadCategory}</strong> (${ex.bwRatio}) | Fase: ${ex.phase}</small>
                    `;
                    exerciseContainer.appendChild(card);
                }
            });
        } catch (error) {
            exerciseContainer.innerHTML = `<p style="color:red; font-size:0.9rem;">⚠️ <strong>Error al cargar ejercicios:</strong> ${error.message}</p>`;
        }
    }
</script>
</body>
</html>
