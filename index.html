<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendón Readapt App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .VERDE { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .NARANJA { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .ROJO { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cuestionario Diario Tendón</h1>
    <form id="tendonForm">
        <div class="form-group">
            <label for="eva">Dolor EVA durante el ejercicio de ayer (0-10):</label>
            <input type="number" id="eva" min="0" max="10" value="0" required>
        </div>

        <div class="form-group">
            <label for="stiffness24h">Respuesta a las 24h (Rigidez/Dolor hoy):</label>
            <select id="stiffness24h">
                <option value="mejor">Mejor o Igual</option>
                <option value="peor">Peor</option>
            </select>
        </div>

        <div class="form-group">
            <label for="canWalk">¿Puedes realizar tus AVD (caminar) sin dolor?</label>
            <select id="canWalk">
                <option value="true">Sí</option>
                <option value="false">No</option>
            </select>
        </div>

        <div class="form-group">
            <label for="consecutiveHighLoadDays">¿Días consecutivos en alta carga (Naranja/Rojo)?</label>
            <input type="number" id="consecutiveHighLoadDays" min="0" max="7" value="0">
        </div>

        <div class="form-group">
            <label for="irsTotal">Puntuación IRS (Recuperación/Estrés 1-28):</label>
            <input type="number" id="irsTotal" min="1" max="28" value="20">
        </div>

        <button type="button" onclick="calculateStatus()">Calcular Semáforo</button>
    </form>

    <div id="result">
        <h2 id="statusTitle"></h2>
        <p id="statusReasons"></p>
        <div id="loadRules"></div>
    </div>
</div>

<script src="js/matrix-algorithm.js"></script>
<script>
    function calculateStatus() {
        const formData = {
            eva: parseInt(document.getElementById('eva').value),
            stiffness24h: document.getElementById('stiffness24h').value,
            canWalkWithoutPain: document.getElementById('canWalk').value === 'true',
            consecutiveHighLoadDays: parseInt(document.getElementById('consecutiveHighLoadDays').value),
            irsTotal: parseInt(document.getElementById('irsTotal').value)
        };

        const result = processAssessment(formData);

        const resultDiv = document.getElementById('result');
        resultDiv.className = result.dailyState;
        resultDiv.style.display = 'block';

        document.getElementById('statusTitle').innerText = 'Estado Diario: ' + result.dailyState;
        document.getElementById('statusReasons').innerText = result.reasons.length > 0 ? 'Motivos: ' + result.reasons.join(' ') : 'Parámetros dentro de rango normal.';

        document.getElementById('loadRules').innerHTML = `
            <strong>Prescripción de carga:</strong><br>
            - Azul (Baja Carga): ${result.rules.AZUL}<br>
            - Naranja (Media Carga): ${result.rules.NARANJA}<br>
            - Rojo (Alta Carga): ${result.rules.ROJO}
        `;
    }
</script>

</body>
</html>
